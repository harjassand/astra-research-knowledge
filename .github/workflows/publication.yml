name: Publication integrity

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install the pinned free local relevance runtime for CPU smoke checks
        run: python3 -m pip install -r knowledge/requirements-agent.txt
      - name: Check the actual PR base and retained public evidence
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 state/check_current.py --base-revision "$PR_BASE" --fetch-sources
      - name: Verify scientific-cycle source bytes without scientific replay
        run: python3 research/2026-10-23-scientific-cycles/verify_payloads.py
